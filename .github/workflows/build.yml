name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A push to main builds only when <Version> has no release yet; list and docs changes need no build.
      # Pull requests and manual runs always build.
      - name: Check for a new version
        id: check
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/SynastriaLauncher.App/SynastriaLauncher.App.csproj | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; raise <Version> in SynastriaLauncher.App.csproj to build and publish a new one."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v6
        if: steps.check.outputs.build == 'true'
        with:
          dotnet-version: "10.0.x"

      # wow_optimize.dll changes only with its pinned commit (in the build script) or the stub, so a build is reused.
      - name: Restore wow-optimize
        id: wow_optimize
        if: steps.check.outputs.build == 'true'
        uses: actions/cache@v6
        with:
          path: src/SynastriaLauncher.Core/Mods/Bundled/wow-optimize
          key: wow-optimize-${{ hashFiles('tools/build-wow-optimize.ps1', 'tools/wow-optimize-stub/**') }}

      # Compiles wow_optimize.dll from its pinned public source; the launcher embeds it.
      - name: Build wow-optimize
        if: steps.check.outputs.build == 'true' && steps.wow_optimize.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/build-wow-optimize.ps1

      # Compiles SynastriaLauncher.dll (embedded) and PatcherHost.exe (for the tests) from native/.
      - name: Build the in-memory patcher
        if: steps.check.outputs.build == 'true'
        shell: pwsh
        run: ./tools/build-patcher.ps1

      - name: Run tests
        if: steps.check.outputs.build == 'true'
        run: dotnet test --solution SynastriaLauncher.slnx

      - name: Publish
        if: steps.check.outputs.build == 'true'
        shell: bash
        run: dotnet publish src/SynastriaLauncher.App -c Release -o publish

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.build == 'true'
        with:
          name: SynastriaLauncher-${{ steps.check.outputs.version }}
          path: publish/SynastriaLauncher.exe

      - name: Publish the release
        if: steps.check.outputs.build == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh release create "v$VERSION" publish/SynastriaLauncher.exe --target "$GITHUB_SHA" --title "Synastria Launcher $VERSION" --generate-notes
