name: Mod Releases

# Daily check of the pinned mod downloads against their authors' latest releases. A change becomes a pull request
# from the mod-updates branch (tested by the Build workflow); nothing reaches main or players on its own.
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency: mod-releases

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Mod Downloads Changed Upstream
    steps:
      - uses: actions/checkout@v7

      - name: Check pinned downloads
        id: check
        run: python3 -I -X utf8 tools/check-mod-releases.py "$RUNNER_TEMP/report.md"

      # The report has no timestamps, so a report equal to the latest pull request's body is a change already
      # pushed, and one already closed unmerged stays declined. A failed check with nothing to update fails the
      # run, which GitHub emails about.
      - name: Report
        shell: bash
        run: |
          report="$RUNNER_TEMP/report.md"
          tidy() { tr -d '\r' | sed -e 's/[[:space:]]*$//'; }
          latest=$(gh pr list --state all --head mod-updates --limit 1 --json number,state,body)
          pr=$(jq -r '.[0] | select(.state == "OPEN") | .number // empty' <<< "$latest")
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            if [ "$(jq -r '.[0].body // empty' <<< "$latest" | tidy)" != "$(tidy < "$report")" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git switch -C mod-updates
              git commit -am "Update pinned mod downloads"
              git push --force origin mod-updates
              gh workflow run build.yml --ref mod-updates
              if [ -n "$pr" ]; then
                gh pr edit "$pr" --body-file "$report"
                gh pr comment "$pr" --body "The upstream releases changed again; the branch and description are updated."
              else
                gh pr create --base main --head mod-updates --title "$TITLE" --body-file "$report"
              fi
            fi
          else
            if [ -n "$pr" ]; then
              gh pr close "$pr" --comment "Every pinned download matches its author's latest release again."
            fi
            if git ls-remote --exit-code --heads origin mod-updates >/dev/null; then
              git push origin --delete mod-updates
            fi
            if [ "${{ steps.check.outputs.problems }}" = "true" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
